name: Windows build + smoke test
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
permissions:
  contents: read
  actions: read     # to fetch the GT6-patched RPCS3 artifact
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Get the GT6-patched RPCS3 (latest successful "GT6 RPCS3 for Windows" run)
        id: rpcs3
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $run = gh run list --repo ${{ github.repository }} --workflow rpcs3-gt6-windows.yml --status success --limit 1 --json databaseId --jq ".[0].databaseId"
          if (-not $run) {
            Write-Host "::warning::No GT6-patched RPCS3 build yet - packaging the stock RPCS3 instead"
            "patched=false" >> $env:GITHUB_OUTPUT
            exit 0
          }
          gh run download $run --repo ${{ github.repository }} -n rpcs3-gt6-win64 -D "$env:RUNNER_TEMP\rpcs3dl"
          $7z = Get-ChildItem "$env:RUNNER_TEMP\rpcs3dl" -Filter *.7z | Select-Object -First 1
          $dst = "$env:RUNNER_TEMP\rpcs3-gt6"
          & 7z x -y "-o$dst" $7z.FullName | Out-Null
          if (-not (Test-Path "$dst\rpcs3.exe")) { throw "rpcs3.exe missing in the patched build" }
          "GT6-patched RPCS3 ($($7z.Name), build run $run). Patches: emulator/gt6-patches" | Set-Content "$dst\GT6-PATCHED.txt"
          "GT6L_BUNDLE_RPCS3_DIR=$dst" >> $env:GITHUB_ENV
          "patched=true" >> $env:GITHUB_OUTPUT
          Write-Host "bundling patched RPCS3: $($7z.Name)"

      - name: Build portable zip (launcher + bundled RPCS3 + SDL3)
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File packaging\build_windows.ps1

      - name: Smoke test
        shell: pwsh
        env:
          GT6L_HOME: ${{ runner.temp }}\gt6l-home
        run: |
          $ErrorActionPreference = "Stop"
          $t = Join-Path $env:RUNNER_TEMP "smoke"
          Expand-Archive dist\GT6-Launcher-win64.zip -DestinationPath $t -Force
          $app = Join-Path $t "GT6-Launcher"
          $exe = Join-Path $app "GT6-Launcher.exe"
          foreach ($f in @($exe, "$app\rpcs3\rpcs3.exe", "$app\_internal\SDL3.dll")) {
            if (-not (Test-Path $f)) { throw "missing in package: $f" }
            Write-Host "ok: $f"
          }
          # 1. CLI: resolves the bundled emulator, reads (empty) state, must exit 0
          $p = Start-Process $exe -ArgumentList "status" -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) { throw "launcher 'status' exited with $($p.ExitCode)" }
          Write-Host "ok: launcher CLI status (exit 0)"
          # 2. GUI: must start and still be running after 20 s (headless Qt)
          $env:QT_QPA_PLATFORM = "offscreen"
          $g = Start-Process $exe -PassThru
          Start-Sleep -Seconds 20
          if ($g.HasExited) { throw "launcher GUI exited early with code $($g.ExitCode)" }
          Stop-Process -Id $g.Id -Force
          Write-Host "ok: launcher GUI stayed up for 20 s"
          # 3. bundled RPCS3: every DLL it imports must be bundled or part of Windows. The only
          #    exception is vulkan-1.dll, which every GPU driver installs (CI runners have no GPU driver).
          python -m pip install --quiet pefile
          $chk = @'
          import os, sys, pefile
          app = sys.argv[1]; sysdir = os.path.join(os.environ["SystemRoot"], "System32")
          missing = []
          for exe in ("rpcs3.exe",):
              pe = pefile.PE(os.path.join(app, exe), fast_load=True)
              pe.parse_data_directories(directories=[pefile.DIRECTORY_ENTRY["IMAGE_DIRECTORY_ENTRY_IMPORT"]])
              for imp in pe.DIRECTORY_ENTRY_IMPORT:
                  d = imp.dll.decode()
                  if d.lower().startswith("api-ms-win-") or d.lower() == "vulkan-1.dll":
                      continue
                  if not (os.path.exists(os.path.join(app, d)) or os.path.exists(os.path.join(sysdir, d))):
                      missing.append(d)
          print("missing DLLs:", missing or "none")
          sys.exit(1 if missing else 0)
          '@
          $chk | Set-Content -Encoding UTF8 "$env:RUNNER_TEMP\depcheck.py"
          python "$env:RUNNER_TEMP\depcheck.py" "$app\rpcs3"
          if ($LASTEXITCODE -ne 0) { throw "bundled rpcs3.exe has unresolved DLL imports" }
          Write-Host "ok: rpcs3.exe dependencies resolve (vulkan-1.dll comes with the GPU driver)"
          if (Test-Path "$env:SystemRoot\System32\vulkan-1.dll") {
            $r = Start-Process "$app\rpcs3\rpcs3.exe" -ArgumentList "--version" -Wait -PassThru -NoNewWindow
            if ($r.ExitCode -ne 0) { throw "bundled rpcs3.exe failed to start ($($r.ExitCode))" }
            Write-Host "ok: rpcs3.exe --version"
          } else {
            Write-Host "note: no Vulkan driver on this CI machine - rpcs3.exe start check skipped"
          }
          if ("${{ steps.rpcs3.outputs.patched }}" -eq "true") {
            if (-not (Test-Path "$app\rpcs3\GT6-PATCHED.txt")) { throw "patched RPCS3 expected but marker missing" }
            Write-Host "ok: package contains the GT6-patched RPCS3"
          } else {
            Write-Host "note: package contains the STOCK RPCS3"
          }
          Write-Host "SMOKE TEST PASSED"

      - uses: actions/upload-artifact@v4
        with:
          name: GT6-Launcher-win64
          path: dist/GT6-Launcher-win64.zip
