# GT6-patched RPCS3 for Windows, built with RPCS3's own Windows (MSVC) CI steps
# (mirrors the "RPCS3 Windows" job of RPCS3's .github/workflows/rpcs3.yml at the pinned commit).
name: GT6 RPCS3 for Windows
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "emulator/gt6-patches/**"
      - ".github/workflows/rpcs3-gt6-windows.yml"

defaults:
  run:
    shell: bash

env:
  RPCS3_COMMIT: eee3f0f7c285f2b8aa18fec278a2146c5cd874eb   # 0.0.43-20565, same as the Linux build
  BUILD_REPOSITORY_NAME: Mabec-games/rpcs3-gt6
  BUILD_SOURCEBRANCHNAME: gt6
  BUILD_PR_NUMBER: ""
  BUILD_ARTIFACTSTAGINGDIRECTORY: ${{ github.workspace }}/artifacts/

jobs:
  build:
    name: RPCS3 (GT6 patches) Windows MSVC
    runs-on: windows-2025-vs2026
    timeout-minutes: 300
    env:
      COMPILER: msvc
      QT_VER_MAIN: '6'
      QT_VER: '6.12.0'
      QT_VER_MSVC: 'msvc2022'
      QT_DATE: '202609280346'
      LLVM_VER: '22.1.8'
      VULKAN_VER: '1.4.341.1'
      VULKAN_SDK_SHA: 'bcf2d75aa9556889ab974858666e20b3655b6055a0db704ccb47279ff33b5bfe'
      CCACHE_SHA: '859141059ac950e1e8cd042c66f842f26b9e3a62a1669a69fe6ba180cb58bbdf'
      CCACHE_BIN_DIR: 'C:\ccache_bin'
      CCACHE_DIR: 'C:\ccache'
      CCACHE_INODECACHE: 'true'
      CCACHE_SLOPPINESS: 'time_macros'
      CCACHE_MAXSIZE: '7G'
      DEPS_CACHE_DIR: ./dependency_cache
      SKIP_RPCS3_TEST: 'true'
    defaults:
      run:
        working-directory: rpcs3
    steps:
      - name: Checkout GT6 PC (patches)
        uses: actions/checkout@v4
        with:
          path: gt6pc

      - name: Checkout upstream RPCS3 at the pinned commit
        uses: actions/checkout@v4
        with:
          repository: RPCS3/rpcs3
          ref: ${{ env.RPCS3_COMMIT }}
          path: rpcs3
          fetch-depth: 0          # RPCS3's version string needs the commit count

      - name: Apply GT6 patches
        run: |
          for p in ../gt6pc/emulator/gt6-patches/*.diff; do
            echo ">> $(basename "$p")"
            git apply --whitespace=nowarn "$p"
          done
          git diff --stat | tail -3

      - name: Setup NuGet
        uses: nuget/setup-nuget@v2

      - name: Restore NuGet packages
        run: nuget restore rpcs3.sln

      - name: Setup env
        shell: pwsh
        run: |
          echo "QTDIR=C:\Qt\${{ env.QT_VER }}\${{ env.QT_VER_MSVC }}_64" >> $env:GITHUB_ENV
          echo "VULKAN_SDK=C:\VulkanSDK\${{ env.VULKAN_VER }}" >> $env:GITHUB_ENV

      - name: Get cache keys
        run: .ci/get_keys-windows.sh

      - name: Restore compiler cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: gt6-ccache-msvc-${{ github.run_id }}
          restore-keys: gt6-ccache-msvc-

      - name: Restore dependency cache
        uses: actions/cache/restore@v4
        id: deps
        with:
          path: rpcs3/dependency_cache
          key: gt6-deps-msvc-${{ env.QT_VER }}-${{ env.VULKAN_SDK_SHA }}-${{ env.CCACHE_SHA }}-${{ hashFiles('rpcs3/llvm.lock') }}

      - name: Download and unpack dependencies
        run: |
          .ci/setup-windows.sh
          .ci/setup-windows-ci-vars.sh win64 msvc

      - name: Export variables
        run: |
          while IFS='=' read -r key val; do
            [[ -z "$key" || "$key" =~ ^# ]] && continue
            echo "$key=$val" >> "$GITHUB_ENV"
          done < .ci/ci-vars.env

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Compile RPCS3
        shell: pwsh
        run: msbuild rpcs3.sln /p:Configuration=Release /v:minimal /p:Platform=x64 /p:PreferredToolArchitecture=x64 /p:CLToolPath=${{ env.CCACHE_BIN_DIR }} /p:UseMultiToolTask=true /p:CustomAfterMicrosoftCommonTargets="${{ github.workspace }}\rpcs3\buildfiles\msvc\ci_only.targets"

      - name: Pack up build artifacts
        run: |
          mkdir -p "$BUILD_ARTIFACTSTAGINGDIRECTORY"
          .ci/deploy-windows.sh
          ls -la "$BUILD_ARTIFACTSTAGINGDIRECTORY"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rpcs3-gt6-win64
          path: ${{ env.BUILD_ARTIFACTSTAGINGDIRECTORY }}
          compression-level: 0
          if-no-files-found: error

      - name: Save compiler cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: gt6-ccache-msvc-${{ github.run_id }}

      - name: Save dependency cache
        if: steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: rpcs3/dependency_cache
          key: ${{ steps.deps.outputs.cache-primary-key }}
